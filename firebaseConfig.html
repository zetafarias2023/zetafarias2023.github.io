<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZetaChat Online</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0;}
body{height:100vh;display:flex;justify-content:center;align-items:center;background:#111;}
#app{width:360px;height:640px;background:#000;border-radius:12px;color:white;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#login,#chat{flex:1;display:none;flex-direction:column;}
#login.active,#chat.active{display:flex;}
header{background:#075E54;padding:8px;font-weight:bold;text-align:center;font-size:0.9em;display:flex;justify-content:space-between;align-items:center;}
#logoutBtn,#membersBtn{font-size:0.7em;cursor:pointer;background:#128C7E;border:none;border-radius:3px;padding:2px 4px;color:white;margin-left:2px;}
#tabs{display:flex;justify-content:center;margin:6px 0;}
.tab{flex:1;text-align:center;padding:6px 0;cursor:pointer;background:#222;color:#fff;border-radius:3px;margin:0 2px;}
.tab.active{background:#25D366;color:#000;font-weight:bold;}
#container{display:flex;flex:1;overflow:hidden;flex-direction:column-reverse;position:relative;}
#membersList{display:none;position:absolute;top:45px;right:5px;background:#222;border-radius:3px;padding:4px;z-index:10;max-height:200px;overflow-y:auto;font-size:0.7em;}
#membersList div{padding:2px 4px;display:flex;justify-content:space-between;align-items:center;margin:2px 0;background:#333;border-radius:3px;}
#messages{flex:1;padding:6px;overflow-y:auto;display:flex;flex-direction:column-reverse;-webkit-overflow-scrolling:touch;}
.msg{margin:2px 0;padding:8px 10px;border-radius:12px;max-width:75%;word-wrap:break-word;font-size:0.8em;font-weight:bold;display:flex;align-items:center;transition:all 0.3s ease;}
.msg span.avatar{margin-right:5px;font-size:1em;}
footer{display:flex;padding:6px;background:#222;}
footer input{flex:1;padding:6px;border-radius:20px;border:none;font-size:0.8em;}
footer button{margin-left:6px;border:none;border-radius:50%;width:32px;height:32px;background:#25D366;color:#fff;font-weight:bold;cursor:pointer;font-size:1em;}
#invite{background:#128C7E;color:white;padding:4px 8px;border:none;border-radius:4px;cursor:pointer;margin:6px auto;font-size:0.8em;display:block;width:90%;}
</style>
</head>
<body>

<div id="app">
  <div id="login" class="active">
    <header>ZetaChat</header>
    <div id="tabs">
      <div class="tab active" onclick="showTab('register')">Registrarse</div>
      <div class="tab" onclick="showTab('loginForm')">Entrar</div>
    </div>
    <div id="register" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <input id="regUser" placeholder="Usuario" style="padding:6px;margin:4px;border:none;border-radius:4px;width:80%;font-size:0.8em;">
      <input id="regAvatar" placeholder="😎" maxlength="2" style="padding:6px;margin:4px;border:none;border-radius:4px;width:80%;text-align:center;font-size:1em;">
      <input id="regRoom" placeholder="Crear Sala" style="padding:6px;margin:4px;border:none;border-radius:4px;width:80%;font-size:0.8em;">
      <button onclick="registerUser()" style="padding:6px 10px;margin-top:6px;border:none;border-radius:4px;background:#25D366;font-size:0.8em;">Registrar & Crear Sala</button>
    </div>
    <div id="loginForm" style="flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;">
      <input id="logUser" placeholder="Usuario" style="padding:6px;margin:4px;border:none;border-radius:4px;width:80%;font-size:0.8em;">
      <input id="logAvatar" placeholder="😎" maxlength="2" style="padding:6px;margin:4px;border:none;border-radius:4px;width:80%;text-align:center;font-size:1em;">
      <input id="logRoom" placeholder="Sala" style="padding:6px;margin:4px;border:none;border-radius:4px;width:80%;font-size:0.8em;">
      <button onclick="loginUser()" style="padding:6px 10px;margin-top:6px;border:none;border-radius:4px;background:#25D366;font-size:0.8em;">Entrar</button>
    </div>
  </div>

  <div id="chat">
    <header>
      <div>
        <button id="membersBtn" onclick="toggleMembers()">Miembros</button>
        <button id="logoutBtn" onclick="logout()">Salir</button>
      </div>
    </header>
    <div id="container">
      <div id="messages"></div>
      <div id="membersList"></div>
    </div>
    <button id="invite" onclick="inviteFriend()">Invitar amigos</button>
    <footer>
      <input id="msgInput" placeholder="Escribe..." onkeydown="if(event.key==='Enter')sendMessage()" />
      <button onclick="sendMessage()">➤</button>
    </footer>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBmb479LPMp_0CM5gpDj6mFzDAEoBGkOg8",authDomain:"zetachat-666a5.firebaseapp.com",databaseURL:"https://zetachat-666a5-default-rtdb.firebaseio.com",projectId:"zetachat-666a5",storageBucket:"zetachat-666a5.firebasestorage.app",messagingSenderId:"772092262393",appId:"1:772092262393:web:eb6266aa6cebcb3794ef28"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let username="", avatar="", room="";
let userColors={};

function showTab(tab){document.getElementById('register').style.display=tab==='register'?'flex':'none';document.getElementById('loginForm').style.display=tab==='loginForm'?'flex':'none';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');}

function registerUser(){
  username=document.getElementById('regUser').value.trim();
  avatar=document.getElementById('regAvatar').value.trim()||"🙂";
  room=document.getElementById('regRoom').value.trim();
  if(!username||!room) return alert("Completá usuario y sala.");
  db.ref('salas/'+room+'/members/'+username).set({avatar:avatar});
  enterChat();
}

function loginUser(){
  username=document.getElementById('logUser').value.trim();
  avatar=document.getElementById('logAvatar').value.trim()||"🙂";
  room=document.getElementById('logRoom').value.trim();
  if(!username||!room) return alert("Completá usuario y sala.");
  db.ref('salas/'+room+'/members/'+username).set({avatar:avatar});
  enterChat();
}

function enterChat(){
  document.getElementById('login').classList.remove('active');
  document.getElementById('chat').classList.add('active');
  listenMessages();
  listenMembers();
}

function sendMessage(){
  const msg=document.getElementById('msgInput').value.trim();
  if(msg==="") return;
  db.ref('salas/'+room+'/messages').push().set({user:username,text:msg,avatar:avatar,time:Date.now()});
  document.getElementById('msgInput').value="";
}

function listenMessages(){
  const msgDiv=document.getElementById('messages');
  db.ref('salas/'+room+'/messages').on('child_added',snap=>{
    const data=snap.val();
    if(!userColors[data.user]) userColors[data.user]=randomColor();
    const div=document.createElement('div');
    div.classList.add('msg');
    div.style.background=userColors[data.user];
    div.style.color='#000';
    div.style.alignSelf=data.user===username?'flex-end':'flex-start';
    const spanAvatar=document.createElement('span');
    spanAvatar.classList.add('avatar'); spanAvatar.textContent=data.avatar||"🙂";
    const spanText=document.createElement('span'); spanText.textContent=data.user+": "+data.text;
    div.appendChild(spanAvatar); div.appendChild(spanText);
    msgDiv.prepend(div);
    msgDiv.scrollTop=0;
  });
}

function listenMembers(){
  const membersDiv=document.getElementById('membersList');
  db.ref('salas/'+room+'/members').on('value',snap=>{
    membersDiv.innerHTML="";
    const members=snap.val()||{};
    for(let member in members){
      const div=document.createElement('div');
      div.textContent=member;
      if(member!==username){
        const btn=document.createElement('button'); btn.textContent="❌"; btn.style.fontSize="0.6em";
        btn.onclick=()=>db.ref('salas/'+room+'/members/'+member).remove();
        div.appendChild(btn);
      }
      membersDiv.appendChild(div);
    }
  });
}

function toggleMembers(){const m=document.getElementById('membersList'); m.style.display=m.style.display==='block'?'none':'block';}
function inviteFriend(){const link=window.location.origin+window.location.pathname+"?room="+encodeURIComponent(room); prompt("Copiá este enlace y compartilo:",link);}
function logout(){db.ref('salas/'+room+'/members/'+username).remove(); username=""; avatar=""; room=""; userColors={}; document.getElementById('login').classList.add('active'); document.getElementById('chat').classList.remove('active'); document.getElementById('msgInput').value=""; document.getElementById('messages').innerHTML=""; document.getElementById('membersList').innerHTML="";}
function randomColor(){const r=Math.floor(Math.random()*200+30);const g=Math.floor(Math.random()*200+30);const b=Math.floor(Math.random()*200+30);return `rgb(${r},${g},${b})`; }
</script>
</body>
</html>
