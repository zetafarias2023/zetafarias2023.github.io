<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZetaChat - Invitación en esquina</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, getDocs, where, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

// Config Firebase
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE_BUCKET",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID",
  measurementId: "TU_MEASUREMENT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// DOM
const usernameForm = document.getElementById("username-form");
const usernameInput = document.getElementById("username-input");
const chatContainer = document.getElementById("chat-container");
const messageForm = document.getElementById("message-form");
const messageInput = document.getElementById("message-input");
const messageList = document.getElementById("message-list");
const usersList = document.getElementById("users-list");
const inviteBtn = document.getElementById("invite-btn");
const invitePopup = document.getElementById("invite-popup");
const inviteLink = document.getElementById("invite-link");
const closeInviteBtn = document.getElementById("close-invite-btn");
const closeRoomBtn = document.getElementById("close-room-btn");

let username = "";
let roomId = "";
let avatar = { initials: "", color: "" };
let userDocId = "";
let isRoomOwner = false;

// Sala por enlace
const urlParams = new URLSearchParams(window.location.search);
roomId = urlParams.get("room");
if(!roomId){
  roomId = Math.random().toString(36).substring(2,10);
  isRoomOwner = true;
}

// Avatar aleatorio
function generateAvatar() {
  const colors = ["#f44336","#e91e63","#9c27b0","#3f51b5","#03a9f4","#4caf50","#ff9800"];
  const initials = username.charAt(0).toUpperCase();
  const color = colors[Math.floor(Math.random()*colors.length)];
  return {initials, color};
}

// Login
usernameForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  username = usernameInput.value.trim();
  if(!username) return alert("Ingresa tu nombre de usuario");
  document.getElementById("username-container").style.display = "none";
  chatContainer.style.display = "grid";
  avatar = generateAvatar();

  const fullLink = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
  inviteLink.value = fullLink;

  closeRoomBtn.style.display = isRoomOwner ? "inline-block" : "none";

  // Registrar usuario
  const usersRef = collection(db, "users");
  const newUserDoc = doc(usersRef);
  userDocId = newUserDoc.id;
  await setDoc(newUserDoc, { username, avatar, roomId, lastActive: serverTimestamp() });

  window.addEventListener("beforeunload", async () => {
    await deleteDoc(doc(db, "users", userDocId));
  });
});

// Enviar mensaje
messageForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if(!text) return;
  await addDoc(collection(db, "messages"), { username, avatar, roomId, text, createdAt: new Date() });
  messageInput.value = "";
});

// Mensajes en tiempo real
const qMessages = query(collection(db, "messages"), orderBy("createdAt"));
onSnapshot(qMessages, (snapshot) => {
  messageList.innerHTML = "";
  snapshot.forEach(docSnap => {
    const msg = docSnap.data();
    if(msg.roomId !== roomId) return;
    const div = document.createElement("div");
    div.className = msg.username === username ? "message sent" : "message received";

    const avatarDiv = document.createElement("div");
    avatarDiv.className = "avatar";
    avatarDiv.style.background = msg.avatar.color;
    avatarDiv.textContent = msg.avatar.initials;
    div.appendChild(avatarDiv);

    const content = document.createElement("div");
    content.className = "content";
    const time = new Date(msg.createdAt.seconds ? msg.createdAt.seconds*1000 : msg.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    content.innerHTML = `<strong>${msg.username}</strong> <span class="time">${time}</span><br>${msg.text}`;
    div.appendChild(content);

    if(msg.username === username){
      const btn = document.createElement("button");
      btn.textContent = "Eliminar";
      btn.onclick = async () => { await deleteDoc(doc(db, "messages", docSnap.id)); alert("Mensaje eliminado"); };
      div.appendChild(btn);
    }

    messageList.appendChild(div);
    messageList.scrollTop = messageList.scrollHeight;
  });
});

// Usuarios conectados
const qUsers = query(collection(db, "users"));
onSnapshot(qUsers, (snapshot) => {
  usersList.innerHTML = "";
  snapshot.forEach(docSnap => {
    const user = docSnap.data();
    if(user.roomId === roomId){
      const div = document.createElement("div");
      div.className = "user";
      div.innerHTML = `<div class="avatar" style="background:${user.avatar.color}">${user.avatar.initials}</div> <span>${user.username}</span>`;
      usersList.appendChild(div);
    }
  });
});

// Cerrar sala
closeRoomBtn.addEventListener("click", async () => {
  if(!confirm("¿Cerrar sala y borrar todos los mensajes?")) return;
  const msgsRef = collection(db, "messages");
  const q = query(msgsRef, where("roomId", "==", roomId));
  const snapshot = await getDocs(q);
  snapshot.forEach(async docSnap => await deleteDoc(doc(db, "messages", docSnap.id)));
  messageList.innerHTML = "";
});

// Botón invitar
inviteBtn.addEventListener("click", () => {
  invitePopup.style.display = invitePopup.style.display === "block" ? "none" : "block";
});

// Cerrar popup invitación
closeInviteBtn.addEventListener("click", () => {
  invitePopup.style.display = "none";
});
</script>

<style>
body { margin:0; font-family: Arial; background:#e5ddd5; }
h2 { text-align:center; }
form { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
input[type="text"] { padding:10px; border-radius:8px; border:none; }
button { background:#34b7f1; border:none; padding:10px; border-radius:8px; color:white; cursor:pointer; }
#chat-container { display:none; height:80vh; background:#fff; border-radius:10px; padding:10px; display:grid; grid-template-columns:150px 1fr; grid-gap:10px; position:relative; }
#message-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
#users-list { background:#f0f0f0; padding:5px; border-radius:8px; display:flex; flex-direction:column; gap:5px; }
.user { display:flex; align-items:center; gap:5px; padding:2px; }
.message { padding:5px; border-radius:10px; display:flex; align-items:flex-start; gap:10px; }
.sent { background:#dcf8c6; align-self:flex-end; }
.received { background:#f1f0f0; align-self:flex-start; }
.avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold; flex-shrink:0; }
.content { max-width:70%; text-align:left; }
.time { font-size:0.7em; color:#555; margin-left:5px; }
#message-form { display:flex; gap:10px; grid-column:2; }
#message-input { flex:1; padding:10px; border-radius:20px; border:1px solid #ccc; }
#invite-btn { position:absolute; top:10px; right:10px; }
#invite-popup { display:none; position:absolute; top:50px; right:10px; background:#fff; border:1px solid #ccc; padding:10px; border-radius:8px; z-index:10; width:200px; }
#close-invite-btn { background:#f44336; padding:5px; margin-top:5px; width:100%; }
#close-room-btn { background:#f44336; display:none; margin-top:5px; width:100%; }
.message button { margin-left:10px; padding:2px 6px; background:#f44336; border:none; color:#fff; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<!-- Login -->
<div id="username-container" class="container">
  <h2>Bienvenido a ZetaChat</h2>
  <form id="username-form">
    <input type="text" id="username-input" placeholder="Ingresa tu nombre de usuario" required>
    <button>Entrar al chat</button>
  </form>
</div>

<!-- Chat -->
<div id="chat-container">
  <!-- Usuarios conectados -->
  <div id="users-list"></div>

  <!-- Chat principal -->
  <div style="display:flex; flex-direction:column; height:100%;">
    <h2>💬 Chat</h2>

    <!-- Botón invitar -->
    <button id="invite-btn">Invitar</button>
    <div id="invite-popup">
      <input type="text" id="invite-link" readonly>
      <button onclick="navigator.clipboard.writeText(inviteLink.value)">Copiar enlace</button>
      <button id="close-invite-btn">Cerrar ventana</button>
      <button id="close-room-btn">Cerrar sala</button>
    </div>

    <div id="message-list"></div>
    <form id="message-form">
      <input type="text" id="message-input" placeholder="Escribe un mensaje..." required>
      <button>Enviar</button>
    </form>
  </div>
</div>

</body>
</html>
