<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OptiCore v7</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#050505;
color:white;
overflow:hidden;
}

/* LOGIN */

.login-screen{
position:fixed;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
z-index:999;
}

.login-box{
width:400px;
background:#0d0d0d;
padding:40px;
border-radius:20px;
border:1px solid #16ff00;
box-shadow:0 0 30px #16ff0050;
}

.login-title{
font-size:40px;
text-align:center;
margin-bottom:30px;
color:#16ff00;
}

.login-title span{
color:#a000ff;
}

.login-box input{
width:100%;
padding:15px;
margin-bottom:15px;
background:#111;
border:1px solid #16ff00;
border-radius:10px;
color:white;
outline:none;
}

.login-btn{
width:100%;
padding:15px;
background:#16ff00;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.login-btn:hover{
transform:scale(1.03);
box-shadow:0 0 20px #16ff00;
}

/* APP */

.app{
display:none;
width:100%;
height:100vh;
}

.sidebar{
width:260px;
background:#080808;
border-right:1px solid #16ff00;
padding:20px;
display:flex;
flex-direction:column;
}

.logo{
font-size:35px;
font-weight:900;
color:#16ff00;
margin-bottom:30px;
}

.logo span{
color:#a000ff;
}

.menu button{
width:100%;
padding:15px;
margin-bottom:10px;
background:#111;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
transition:.3s;
text-align:left;
}

.menu button:hover{
background:#16ff00;
color:black;
}

.hidden{
display:none;
}

.status{
margin-top:auto;
padding:20px;
background:#111;
border:1px solid #16ff00;
border-radius:15px;
}

.main{
flex:1;
padding:20px;
overflow:auto;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:20px;
}

.user-box,
.license-box{
padding:10px 20px;
background:#111;
border:1px solid #16ff00;
border-radius:10px;
}

.banner{
height:180px;
background:linear-gradient(90deg,#111,#0a0a0a);
border:1px solid #16ff00;
border-radius:20px;
padding:30px;
margin-bottom:20px;
display:flex;
align-items:center;
overflow:hidden;
position:relative;
}

.banner::before{
content:'';
position:absolute;
width:300px;
height:300px;
background:#16ff0020;
filter:blur(100px);
right:-100px;
top:-100px;
}

.banner h1{
font-size:60px;
color:#16ff00;
}

.banner h1 span{
color:#a000ff;
}

.banner p{
margin-top:10px;
color:#aaa;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.card{
background:#0d0d0d;
padding:20px;
border-radius:20px;
border:1px solid #16ff00;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 20px #16ff0050;
}

.card h2{
color:#16ff00;
margin-bottom:10px;
}

.card p{
color:#aaa;
margin-bottom:20px;
line-height:1.6;
}

.download-btn{
padding:12px 20px;
background:#16ff00;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
transition:.3s;
margin-right:10px;
}

.download-btn:hover{
transform:scale(1.05);
box-shadow:0 0 20px #16ff00;
}

.delete-btn{
padding:12px 20px;
background:#ff0033;
border:none;
border-radius:10px;
color:white;
font-weight:700;
cursor:pointer;
}

.admin-input{
width:100%;
padding:15px;
margin-bottom:15px;
background:#111;
border:1px solid #16ff00;
border-radius:10px;
color:white;
outline:none;
}

@media(max-width:900px){

.sidebar{
display:none;
}

.banner h1{
font-size:35px;
}

}

</style>

</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

<div class="login-box">

<h1 class="login-title">
OPTICORE <span>v7</span>
</h1>

<input type="email" id="email" placeholder="Correo">

<input type="password" id="password" placeholder="Contraseña">

<input type="text" id="license" placeholder="Licencia">

<button class="login-btn" onclick="login()">
INGRESAR
</button>

</div>

</div>

<!-- APP -->

<div class="app" id="app">

<div class="sidebar">

<div class="logo">
OPTI<span>CORE</span>
</div>

<div class="menu">

<button onclick="openSection('inicio')">
🏠 INFORMACIÓN
</button>

<button onclick="openSection('descargas')">
⬇ DESCARGAS
</button>

<button onclick="openSection('optimizaciones')">
⚡ OPTIMIZACIONES
</button>

<button onclick="openSection('herramientas')">
🛠 HERRAMIENTAS
</button>

<button onclick="openSection('boost')">
🚀 BOOST
</button>

<button
id="adminBtn"
class="hidden"
onclick="openSection('paneladmin')">

👑 PANEL ADMIN

</button>

</div>

<div class="status">

<h3>● ONLINE</h3>

<p>Servidor conectado</p>

</div>

</div>

<div class="main">

<div class="topbar">

<div class="license-box" id="licenseInfo">
🔑 LICENCIA
</div>

<div class="user-box" id="userInfo">
👤 USER
</div>

</div>

<div class="banner">

<div>

<h1>
OPTICORE <span>v7</span>
</h1>

<p>
Panel premium gamer.
</p>

</div>

</div>

<div id="content"></div>

</div>

</div>

<script>

/* ADMIN */

const ADMIN_EMAIL =
"fariaszeta7@gmail.com";

/* LICENCIAS */

const licenses = {

"ZETA-166-VIP":{
days:30
},

"PREMIUM-999":{
days:90
},

"CLIENTE-2026":{
days:365
}

};

/* ARCHIVOS */

let downloads =
JSON.parse(
localStorage.getItem("downloads")
) || [];

/* LOGIN */

function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const license =
document.getElementById("license").value;

if(
email === "" ||
password === "" ||
license === ""
){

alert("Completa todos los campos");
return;

}

if(!licenses[license]){

alert("LICENCIA INVÁLIDA");
return;

}

document.getElementById("loginScreen")
.style.display="none";

document.getElementById("app")
.style.display="flex";

document.getElementById("userInfo")
.innerHTML =
"👤 "+email;

document.getElementById("licenseInfo")
.innerHTML =
"🔑 "+license+
" | ⏳ "+
licenses[license].days+
" días";

/* ADMIN */

if(email === ADMIN_EMAIL){

document.getElementById("adminBtn")
.classList.remove("hidden");

window.isAdmin = true;

}else{

window.isAdmin = false;

}

openSection("inicio");

}

/* SECCIONES */

const sections = {

inicio:`

<div class="cards">

<div class="card">

<h2>
🔒 PANEL CON LICENCIA
</h2>

<p>

Este panel premium está protegido con licencia privada.

<br><br>

❌ NO compartas:
<br><br>

• Licencias
<br>
• Accesos
<br>
• Archivos premium
<br>
• Optimizaciones
<br><br>

Si detectamos actividad sospechosa:
<br><br>

❌ La licencia será baneada permanentemente.
<br>
❌ El acceso será removido.
<br>
❌ Sin reembolso.

</p>

</div>

<div class="card">

<h2>
👑 AUTORES
</h2>

<p>

Creación oficial:
<br><br>

⚡ zeta166
<br>
⚡ lauty
<br><br>

OptiCore v7
<br>
Panel premium gamer.

</p>

</div>

</div>

`,

descargas:`

<div class="cards"
id="downloadsContainer">

</div>

`,

optimizaciones:`

<div class="cards">

<div class="card">

<h2>🧹 LIMPIAR RAM</h2>

<p>
Libera memoria RAM automáticamente.
</p>

<button class="download-btn"
onclick="cleanRAM()">

DESCARGAR BAT

</button>

</div>

<div class="card">

<h2>⚡ BOOST INTERNET</h2>

<p>
Optimiza conexión y ping.
</p>

<button class="download-btn"
onclick="boostInternet()">

DESCARGAR BAT

</button>

</div>

</div>

`,

herramientas:`

<div class="cards">

<div class="card">

<h2>📊 ANALIZAR PC</h2>

<p>
Escaneo completo del sistema.
</p>

<button class="download-btn"
onclick="analyzePC()">

DESCARGAR BAT

</button>

</div>

</div>

`,

boost:`

<div class="cards">

<div class="card">

<h2>🚀 BOOST EXTREMO</h2>

<p>
Máximo rendimiento gamer.
</p>

<button class="download-btn"
onclick="extremeBoost()">

DESCARGAR BAT

</button>

</div>

</div>

`,

paneladmin:`

<div class="cards">

<div class="card">

<h2>👑 SUBIR ARCHIVO</h2>

<p>
Solo administrador.
</p>

<input
type="text"
id="fileTitle"
placeholder="Nombre del archivo"
class="admin-input">

<input
type="file"
id="fileUpload"
class="admin-input">

<button
class="download-btn"
onclick="uploadFile()">

SUBIR ARCHIVO

</button>

</div>

</div>

`

};

/* ABRIR SECCIÓN */

function openSection(section){

document.getElementById("content")
.innerHTML =
sections[section];

if(section === "descargas"){

setTimeout(()=>{

renderDownloads();

},100);

}

}

/* SUBIR ARCHIVO */

function uploadFile(){

const title =
document.getElementById("fileTitle").value;

const file =
document.getElementById("fileUpload").files[0];

if(title === "" || !file){

alert("Completa todo");
return;

}

const reader =
new FileReader();

reader.onload = function(e){

downloads.push({

title:title,
name:file.name,
data:e.target.result

});

localStorage.setItem(
"downloads",
JSON.stringify(downloads)
);

alert("ARCHIVO SUBIDO");

};

reader.readAsDataURL(file);

}

/* MOSTRAR DESCARGAS */

function renderDownloads(){

const container =
document.getElementById("downloadsContainer");

if(!container) return;

container.innerHTML = "";

if(downloads.length === 0){

container.innerHTML = `

<div class="card">

<h2>
📦 SIN ARCHIVOS
</h2>

<p>
No hay archivos subidos.
</p>

</div>

`;

return;

}

downloads.forEach((item,index)=>{

container.innerHTML += `

<div class="card">

<h2>
📦 ${item.title}
</h2>

<p>
Archivo:
${item.name}
</p>

<a href="${item.data}"
download="${item.name}">

<button class="download-btn">
DESCARGAR
</button>

</a>

${
window.isAdmin
?

`
<button
class="delete-btn"
onclick="deleteFile(${index})">

ELIMINAR

</button>
`

:

""

}

</div>

`;

});

}

/* ELIMINAR */

function deleteFile(index){

downloads.splice(index,1);

localStorage.setItem(
"downloads",
JSON.stringify(downloads)
);

renderDownloads();

alert("ARCHIVO ELIMINADO");

}

/* DESCARGAR BAT */

function downloadBAT(name,content){

const blob =
new Blob([content],{
type:"text/plain"
});

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download = name;

a.click();

URL.revokeObjectURL(url);

}

/* OPTIMIZACIONES */

function cleanRAM(){

const bat = `

@echo off
title OPTICORE RAM CLEANER
color 0A

ipconfig /flushdns

taskkill /f /im chrome.exe
taskkill /f /im discord.exe

%windir%\\system32\\rundll32.exe advapi32.dll,ProcessIdleTasks

echo RAM OPTIMIZADA
pause

`;

downloadBAT(
"OptiCore_RAM_Cleaner.bat",
bat
);

}

function boostInternet(){

const bat = `

@echo off
title OPTICORE INTERNET BOOST
color 0B

ipconfig /flushdns
netsh winsock reset
netsh int ip reset

echo INTERNET OPTIMIZADA
pause

`;

downloadBAT(
"OptiCore_Internet_Boost.bat",
bat
);

}

function analyzePC(){

const bat = `

@echo off
title OPTICORE ANALYZER
color 0E

systeminfo

pause

`;

downloadBAT(
"OptiCore_Analyzer.bat",
bat
);

}

function extremeBoost(){

const bat = `

@echo off
title OPTICORE EXTREME BOOST
color 0C

powercfg -setactive SCHEME_MIN

ipconfig /flushdns

cleanmgr /sagerun:1

echo BOOST EXTREMO ACTIVADO
pause

`;

downloadBAT(
"OptiCore_Extreme_Boost.bat",
bat
);

}

function optimizePC(){

const bat = `

@echo off
title OPTICORE FPS BOOST
color 0A

powercfg -setactive SCHEME_MIN

cleanmgr /sagerun:1

echo FPS BOOST ACTIVADO
pause

`;

downloadBAT(
"OptiCore_FPS_Boost.bat",
bat
);

}

function gameMode(){

const bat = `

@echo off
title OPTICORE GAME MODE
color 0D

reg add "HKCU\\Software\\Microsoft\\GameBar" /v AllowAutoGameMode /t REG_DWORD /d 1 /f

echo GAME MODE ACTIVADO
pause

`;

downloadBAT(
"OptiCore_Game_Mode.bat",
bat
);

}

</script>

</body>
</html>
