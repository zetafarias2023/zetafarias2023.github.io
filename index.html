<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>166 Producer - Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #090909;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 860px;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid #282828;
            position: relative;
        }

        /* Pantalla de Login / Registro */
        .full-login-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #121212;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .full-login-screen h1 {
            font-size: 1.8rem;
            color: #1DB954;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .full-login-screen p {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
        }

        .login-form {
            width: 100%;
            max-width: 300px;
        }

        .login-form input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #181818;
            border: 1px solid #282828;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .login-form input:focus { border-color: #1DB954; }

        .login-form button {
            width: 100%;
            padding: 12px;
            background: #1DB954;
            border: none;
            border-radius: 25px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .login-form button:hover { background: #1ed760; }

        .auth-toggle-link {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #aaa;
            cursor: pointer;
        }

        .auth-toggle-link span {
            color: #1DB954;
            text-decoration: underline;
        }

        /* Header Compacto */
        header {
            padding: 12px 16px;
            background: linear-gradient(to bottom, #1f1f1f, #121212);
            border-bottom: 1px solid #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1rem;
            letter-spacing: 1px;
            color: #1DB954;
            font-weight: 800;
        }

        /* Perfil Compacto */
        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #fff;
            background: #181818;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #282828;
            cursor: pointer;
        }

        .verified-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 13px;
            height: 13px;
            background-color: #1d9bf0;
            color: #fff;
            font-size: 8px;
            border-radius: 50%;
            font-weight: bold;
        }

        .followers-chip {
            color: #1DB954;
            font-size: 0.72rem;
            background: rgba(29, 185, 84, 0.1);
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .btn-logout {
            background: none;
            border: none;
            color: #888;
            font-size: 0.85rem;
            cursor: pointer;
            margin-left: 4px;
        }

        .btn-logout:hover { color: #ff4d4d; }

        /* Navegación */
        .nav-tabs {
            display: flex;
            background: #181818;
            border-bottom: 1px solid #282828;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: #888;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #1DB954;
            border-bottom-color: #1DB954;
        }

        /* Vistas */
        .view-content {
            flex: 1;
            overflow-y: auto;
            display: none;
            flex-direction: column;
        }

        .view-content.active { display: flex; }

        .upload-section {
            padding: 10px 16px;
            background-color: #181818;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
        }

        .upload-btn {
            background-color: #1DB954;
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            border: none;
        }

        .file-input { display: none; }

        /* Buscador de usuarios */
        .search-box {
            padding: 10px 16px;
            background: #181818;
            border-bottom: 1px solid #282828;
        }

        .search-box input {
            width: 100%;
            padding: 8px 14px;
            background: #242424;
            border: 1px solid #333;
            border-radius: 20px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }

        .search-box input:focus { border-color: #1DB954; }

        /* Tarjeta de usuario */
        .user-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #222;
        }

        .user-card-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #282828;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            color: #1DB954;
            font-weight: bold;
        }

        .btn-follow {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #1DB954;
            background: #1DB954;
            color: #000;
            transition: 0.2s;
        }

        .btn-follow.following {
            background: transparent;
            color: #ff4d4d;
            border-color: #ff4d4d;
        }

        /* Ventana Desplegable */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            width: 100%;
            max-width: 340px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: 80%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .modal-header h3 { font-size: 0.95rem; color: #1DB954; }
        .modal-close { background: none; border: none; color: #888; font-size: 1.1rem; cursor: pointer; }

        .modal-body {
            overflow-y: auto;
            flex: 1;
        }

        .modal-list-title {
            font-size: 0.75rem;
            color: #888;
            margin: 8px 0 4px 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Lista de reproducción */
        .playlist-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px 0;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .song-item:hover { background-color: rgba(255,255,255,0.05); }

        .song-icon {
            width: 38px;
            height: 38px;
            background-color: #282828;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            color: #b3b3b3;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .song-info {
            flex: 1;
            overflow: hidden;
            padding-right: 10px;
        }

        .song-title {
            font-size: 0.85rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .song-artist {
            font-size: 0.72rem;
            color: #b3b3b3;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
        }

        .btn-delete:hover { color: #ff4d4d; }

        /* Reproductor */
        .player-bar {
            background-color: #161616;
            padding: 12px 16px 16px 16px;
            border-top: 1px solid #282828;
        }

        .current-playing {
            text-align: center;
            margin-bottom: 6px;
        }

        .current-playing-title {
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-playing-artist {
            font-size: 0.72rem;
            color: #b3b3b3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: #b3b3b3;
            margin-bottom: 4px;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background-color: #333;
            border-radius: 2px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            background-color: #1DB954;
            border-radius: 2px;
            width: 0%;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            margin-bottom: 8px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .play-pause-btn {
            width: 38px;
            height: 38px;
            background-color: #1DB954;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider {
            flex: 1;
            accent-color: #1DB954;
            cursor: pointer;
            height: 4px;
        }

        .empty-state {
            text-align: center;
            color: #666;
            margin-top: 40px;
            padding: 0 20px;
            font-size: 0.8rem;
        }

        .section-header-title {
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #1DB954;
            background: #181818;
            border-bottom: 1px solid #282828;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Login / Registro -->
        <div class="full-login-screen" id="login-screen">
            <h1>166 PRODUCER</h1>
            <p id="login-subtitle">Inicia sesión para ingresar a la plataforma</p>
            <div class="login-form">
                <input type="text" id="login-username" placeholder="Usuario" autocomplete="off">

                </div>

        </div>

        <!-- Desplegable de Seguidores/Siguiendo -->
        <div class="modal-overlay" id="follow-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Red de Contactos</h3>
                    <button class="modal-close" id="close-modal-btn">✕</button>
                </div>
                <div class="modal-body" id="modal-body-content"></div>
            </div>
        </div>

        <!-- Header -->
        <header>
            <h1>166 PRODUCER</h1>
            <div class="user-profile-info" id="btn-open-follow-details" title="Haz clic para ver seguidores">

        <!-- Navegación -->

        <!-- Pestaña 1: Mis Temas Offline -->
        <div class="view-content active" id="tab-local">

        <div class="view-content" id="tab-community">
            <div class="search-box">
                <input type="text" id="user-search-input" placeholder="Buscar usuario real registrado...">
            </div>
            <div class="section-header-title">Personas Reales en la Plataforma</div>
            <div class="playlist-list" id="users-list"></div>
        </div>

        <!-- Pestaña 3: Música 166 Oficial -->
        <div class="view-content" id="tab-zeta">
            <div class="upload-section" id="zeta-admin-upload-section" style="display: none;">
                <span style="font-size: 0.75rem; color: #1DB954; font-weight: bold;">Panel Admin (zeta166)</span>
                <label class="upload-btn">
                    + Publicar Tema Oficial
                    <input type="file" class="file-input" id="file-input-zeta" accept="audio/*" multiple>
                </label>
            </div>
            <div class="section-header-title" style="display: flex; align-items: center; gap: 5px;">
                <span>Catálogo Oficial zeta166</span>

            <div class="playlist-list" id="zeta-playlist"></div>

        <!-- Player Bar -->
        <div class="player-bar">
            <audio id="audio-element"></audio>
            
            <div class="current-playing">
                <div class="current-playing-title" id="current-title">Selecciona una pista</div>
                <div class="current-playing-artist" id="current-artist">
                    <span id="artist-name-text">166 Producer</span>
                    <span id="artist-verified-icon" class="verified-badge" style="display: none;">✓</span>
                </div>
            </div>

            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="duration-time">0:00</span>
            </div>

            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="controls">
                <button class="control-btn" id="shuffle-btn">🔀</button>
                <button class="control-btn" id="prev-btn">⏮</button>
                <button class="play-pause-btn" id="play-btn">▶</button>
                <button class="control-btn" id="next-btn">⏭</button>
                <button class="control-btn" id="repeat-btn">🔁</button>
            </div>

            <div class="volume-container">
                <span style="font-size: 0.75rem; color: #888;">🔊</span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>
    </div>

    <script>
        /* Base de Datos IndexedDB */
        const DB_NAME = '166ProducerDB_v7';
        const STORE_LOCAL = 'user_songs';
        const STORE_ZETA = 'zeta_songs';
        let db = null;

        // Lista de Usuarios Verificados
        const VERIFIED_USERS = ['zeta166', 'polli2', 'mc166'];
        const ZETA_BOT_FOLLOWERS = 200000;

        function isUserVerified(username) {
            if (!username) return false;
            return VERIFIED_USERS.includes(username.toLowerCase());
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_LOCAL)) {
                        database.createObjectStore(STORE_LOCAL, { keyPath: 'id', autoIncrement: true });
                    }
                    if (!database.objectStoreNames.contains(STORE_ZETA)) {
                        database.createObjectStore(STORE_ZETA, { keyPath: 'id', autoIncrement: true });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e);
            });
        }

        function saveLocalSong(name, blob, username) {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_LOCAL, 'readwrite');
                tx.objectStore(STORE_LOCAL).add({ name, blob, user: username }).onsuccess = (e) => resolve(e.target.result);
            });
        }

        function saveZetaSong(name, blob) {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_ZETA, 'readwrite');
                tx.objectStore(STORE_ZETA).add({ name, blob }).onsuccess = (e) => resolve(e.target.result);
            });
        }

        function getUserLocalSongs(username) {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_LOCAL, 'readonly');
                tx.objectStore(STORE_LOCAL).getAll().onsuccess = (e) => {
                    const all = e.target.result || [];
                    resolve(all.filter(s => s.user === username));
                };
            });
        }

        function getZetaSongs() {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_ZETA, 'readonly');
                tx.objectStore(STORE_ZETA).getAll().onsuccess = (e) => resolve(e.target.result || []);
            });
        }

        function deleteSongFromDB(storeName, id) {
            return new Promise((resolve) => {
                const tx = db.transaction(storeName, 'readwrite');
                tx.objectStore(storeName).delete(id).onsuccess = () => resolve();
            });
        }

        /* Estado Global */
        let currentUser = null;
        let isRegisterMode = false;

        let localSongsList = [];
        let zetaSongsList = [];

        let currentPlaylist = [];
        let currentIndex = 0;
        let isPlaying = false;

        /* DOM Elements */
        const loginScreen = document.getElementById('login-screen');
        const loginUsernameInput = document.getElementById('login-username');
        const loginPasswordInput = document.getElementById('login-password');
        const btnLoginSubmit = document.getElementById('btn-login-submit');
        const toggleLoginMode = document.getElementById('toggle-login-mode');
        const loginSubtitle = document.getElementById('login-subtitle');

        const headerUserName = document.getElementById('header-user-name');
        const headerVerified = document.getElementById('header-verified');
        const headerFollowersCount = document.getElementById('header-followers-count');
        const btnLogout = document.getElementById('btn-logout');
        const zetaAdminUploadSection = document.getElementById('zeta-admin-upload-section');

        const followModal = document.getElementById('follow-modal');
        const modalBodyContent = document.getElementById('modal-body-content');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const btnOpenFollowDetails = document.getElementById('btn-open-follow-details');

        const userSearchInput = document.getElementById('user-search-input');
        const usersListContainer = document.getElementById('users-list');

        const audioElement = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currentTitle = document.getElementById('current-title');
        const artistNameText = document.getElementById('artist-name-text');
        const artistVerifiedIcon = document.getElementById('artist-verified-icon');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const volumeSlider = document.getElementById('volume-slider');

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function formatFollowersNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(0) + 'k';
            return num.toString();
        }

        /* Autenticación & Registro */
        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            const activeUser = localStorage.getItem('166_active_user');
            if (activeUser) {
                completeLogin(activeUser);
            } else {
                loginScreen.style.display = 'flex';
            }
        });

        toggleLoginMode.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            loginSubtitle.textContent = isRegisterMode ? 'Crea tu cuenta para ingresar' : 'Inicia sesión para ingresar a la plataforma';
            btnLoginSubmit.textContent = isRegisterMode ? 'Registrarse' : 'Ingresar';
            toggleLoginMode.innerHTML = isRegisterMode ? '¿Ya tienes cuenta? <span>Inicia Sesión</span>' : '¿No tienes cuenta? <span>Regístrate</span>';
        });

        btnLoginSubmit.addEventListener('click', () => {
            const user = loginUsernameInput.value.trim();
            const pass = loginPasswordInput.value.trim();
            if (!user || !pass) return alert('Por favor ingresa usuario y contraseña.');

            const users = JSON.parse(localStorage.getItem('166_registered_users') || '{}');

            if (isRegisterMode) {
                if (users[user.toLowerCase()]) return alert('El usuario ya existe. Elige otro nombre.');
                users[user.toLowerCase()] = { username: user, password: pass };
                localStorage.setItem('166_registered_users', JSON.stringify(users));
                completeLogin(user);
            } else {
                const existing = users[user.toLowerCase()];
                // Cuentas administradoras por defecto si no existen
                if ((user.toLowerCase() === 'zeta166' || user.toLowerCase() === 'polli2' || user.toLowerCase() === 'mc166') && !existing) {
                    users[user.toLowerCase()] = { username: user, password: pass };
                    localStorage.setItem('166_registered_users', JSON.stringify(users));
                    completeLogin(user);
                    return;
                }
                if (existing && existing.password === pass) {
                    completeLogin(existing.username);
                } else {
                    alert('Usuario o contraseña incorrectos.');
                }
            }
        });

        async function completeLogin(username) {
            currentUser = username;
            localStorage.setItem('166_active_user', username);
            headerUserName.textContent = username;

            // Insignia verificado para zeta166, polli2 y mc166
            const isVerified = isUserVerified(username);
            headerVerified.style.display = isVerified ? 'inline-flex' : 'none';
            zetaAdminUploadSection.style.display = (username.toLowerCase() === 'zeta166') ? 'flex' : 'none';

            loginScreen.style.display = 'none';
            loginUsernameInput.value = '';
            loginPasswordInput.value = '';

            await loadAllData();
            updateHeaderFollowersCount();
            renderSocialSection();
        }

        // Cierre de Sesión
        btnLogout.addEventListener('click', (e) => {
            e.stopPropagation();
            localStorage.removeItem('166_active_user');
            audioElement.pause();
            currentUser = null;
            loginScreen.style.display = 'flex';
        });

        /* Navegación por pestañas */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));

                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        /* Carga de Datos */
        async function loadAllData() {
            const userLocals = await getUserLocalSongs(currentUser);
            localSongsList = userLocals.map(item => ({
                id: item.id,
                name: item.name,
                artist: currentUser,
                isVerified: isUserVerified(currentUser),
                url: URL.createObjectURL(item.blob)
            }));
            renderPlaylist('local-playlist', localSongsList, true, STORE_LOCAL);

            const zSongs = await getZetaSongs();
            zetaSongsList = zSongs.map(item => ({
                id: item.id,
                name: item.name,
                artist: 'zeta166',
                isVerified: true,
                url: URL.createObjectURL(item.blob)
            }));
            renderPlaylist('zeta-playlist', zetaSongsList, currentUser.toLowerCase() === 'zeta166', STORE_ZETA);
        }

        document.getElementById('file-input-local').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|m4a|aac)$/i)) {
                    const cleanName = file.name.replace(/\.[^/.]+$/, "");
                    await saveLocalSong(cleanName, file, currentUser);
                }
            }
            await loadAllData();
        });

        document.getElementById('file-input-zeta').addEventListener('change', async (e) => {
            if (currentUser.toLowerCase() !== 'zeta166') return;
            const files = Array.from(e.target.files);
            for (const file of files) {
                if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|m4a|aac)$/i)) {
                    const cleanName = file.name.replace(/\.[^/.]+$/, "");
                    await saveZetaSong(cleanName, file);
                }
            }
            await loadAllData();
        });

        /* LÓGICA DE SEGUIDORES */
        function getFollowData() {
            return JSON.parse(localStorage.getItem('166_follow_data') || '{}');
        }

        function saveFollowData(data) {
            localStorage.setItem('166_follow_data', JSON.stringify(data));
        }

        function getTargetFollowersCount(targetKey) {
            const followData = getFollowData();
            let count = 0;

            if (targetKey === 'zeta166') {
                count += ZETA_BOT_FOLLOWERS;
            }

            Object.keys(followData).forEach(u => {
                if ((followData[u] || []).includes(targetKey)) {
                    count++;
                }
            });

            return count;
        }

        function updateHeaderFollowersCount() {
            const userKey = currentUser.toLowerCase();
            const count = getTargetFollowersCount(userKey);
            headerFollowersCount.textContent = `${formatFollowersNumber(count)} seg.`;
        }

        userSearchInput.addEventListener('input', () => {
            renderSocialSection();
        });

        function renderSocialSection() {
            const followData = getFollowData();
            const registeredUsers = JSON.parse(localStorage.getItem('166_registered_users') || '{}');
            const userKey = currentUser.toLowerCase();
            const filterText = userSearchInput.value.trim().toLowerCase();

            usersListContainer.innerHTML = '';
            
            const otherUsers = Object.values(registeredUsers).filter(u => {
                const uName = u.username.toLowerCase();
                return uName !== userKey && uName.includes(filterText);
            });

            if (otherUsers.length === 0) {
                usersListContainer.innerHTML = `<div class="empty-state">No se encontraron personas reales registradas.</div>`;
                return;
            }

            otherUsers.forEach(userObj => {
                const targetKey = userObj.username.toLowerCase();
                const isFollowing = (followData[userKey] || []).includes(targetKey);
                const targetFollowersCount = getTargetFollowersCount(targetKey);

                const card = document.createElement('div');
                card.classList.add('user-card');

                const hasVerifiedBadge = isUserVerified(targetKey);

                card.innerHTML = `
                    <div class="user-card-info">
                        <div class="user-avatar">${userObj.username.substring(0, 2).toUpperCase()}</div>
                        <div>
                            <div style="font-size: 0.82rem; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 4px;">
                                <span>${userObj.username}</span>
                                ${hasVerifiedBadge ? '<span class="verified-badge">✓</span>' : ''}
                            </div>
                            <div style="font-size: 0.7rem; color: #888;">${formatFollowersNumber(targetFollowersCount)} seguidores</div>
                        </div>
                    </div>
                    <button class="btn-follow ${isFollowing ? 'following' : ''}">
                        ${isFollowing ? 'Dejar de seguir' : 'Seguir'}
                    </button>
                `;

                card.querySelector('.btn-follow').addEventListener('click', () => {
                    toggleFollowUser(targetKey);
                });

                usersListContainer.appendChild(card);
            });
        }

        function toggleFollowUser(targetKey) {
            const followData = getFollowData();
            const userKey = currentUser.toLowerCase();

            if (!followData[userKey]) {
                followData[userKey] = [];
            }

            const index = followData[userKey].indexOf(targetKey);
            if (index > -1) {
                followData[userKey].splice(index, 1);
            } else {
                followData[userKey].push(targetKey);
            }

            saveFollowData(followData);
            updateHeaderFollowersCount();
            renderSocialSection();
            if (followModal.style.display === 'flex') {
                openFollowModal();
            }
        }

        /* Desplegable para ver seguidores/siguiendo */
        btnOpenFollowDetails.addEventListener('click', () => {
            openFollowModal();
        });

        closeModalBtn.addEventListener('click', () => {
            followModal.style.display = 'none';
        });

        function openFollowModal() {
            const followData = getFollowData();
            const registeredUsers = JSON.parse(localStorage.getItem('166_registered_users') || '{}');
            const userKey = currentUser.toLowerCase();

            const followingKeys = followData[userKey] || [];

            const followersKeys = [];
            Object.keys(followData).forEach(u => {
                if ((followData[u] || []).includes(userKey)) {
                    followersKeys.push(u);
                }
            });

            let html = `<div class="modal-list-title">A quienes sigues (${followingKeys.length})</div>`;

            if (followingKeys.length === 0) {
                html += `<div style="font-size: 0.75rem; color: #666; padding: 5px 0;">No sigues a ningún usuario aún.</div>`;
            } else {
                followingKeys.forEach(key => {
                    const name = registeredUsers[key] ? registeredUsers[key].username : key;
                    const verified = isUserVerified(key);
                    html += `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding: 6px 0; border-bottom:1px solid #222;">
                            <span style="font-size:0.8rem; font-weight:bold; color:#fff; display:flex; align-items:center; gap:4px;">
                                ${name} ${verified ? '<span class="verified-badge">✓</span>' : ''}
                            </span>
                            <button onclick="toggleFollowUser('${key}')" style="background:none; border:none; color:#ff4d4d; font-size:0.7rem; cursor:pointer;">Dejar de seguir</button>
                        </div>
                    `;
                });
            }

            const totalFollowersCount = getTargetFollowersCount(userKey);
            html += `<div class="modal-list-title" style="margin-top:15px;">Tus Seguidores (${formatFollowersNumber(totalFollowersCount)})</div>`;

            if (userKey === 'zeta166') {
                html += `<div style="font-size: 0.72rem; color: #1DB954; padding: 4px 0; font-weight: bold;">+ 200.000 seguidores verificados (Fans Red 166)</div>`;
            }

            if (followersKeys.length === 0 && userKey !== 'zeta166') {
                html += `<div style="font-size: 0.75rem; color: #666; padding: 5px 0;">Aún no tienes seguidores reales.</div>`;
            } else {
                followersKeys.forEach(key => {
                    const name = registeredUsers[key] ? registeredUsers[key].username : key;
                    const verified = isUserVerified(key);
                    html += `
                        <div style="padding: 6px 0; border-bottom:1px solid #222; font-size:0.8rem; font-weight:bold; color:#fff; display:flex; align-items:center; gap:4px;">
                            ${name} ${verified ? '<span class="verified-badge">✓</span>' : ''}
                        </div>
                    `;
                });
            }

            modalBodyContent.innerHTML = html;
            followModal.style.display = 'flex';
        }

        /* Renderizar Lista de Canciones */
        function renderPlaylist(elementId, songList, allowDelete, storeName) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            if (songList.length === 0) {
                container.innerHTML = `<div class="empty-state">No hay canciones en esta lista.</div>`;
                return;
            }

            songList.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('song-item');

                item.innerHTML = `
                    <div class="song-icon">🎼</div>
                    <div class="song-info">
                        <div class="song-title">${song.name}</div>
                        <div class="song-artist">
                            <span>${song.artist}</span>
                            ${song.isVerified ? '<span class="verified-badge">✓</span>' : ''}
                        </div>
                    </div>
                    <div class="item-actions">
                        ${allowDelete ? `<button class="btn-delete" title="Eliminar">🗑</button>` : ''}
                    </div>
                `;

                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('btn-delete')) return;
                    playSongFromList(songList, index);
                });

                if (allowDelete) {
                    item.querySelector('.btn-delete').addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await deleteSongFromDB(storeName, song.id);
                        await loadAllData();
                    });
                }

                container.appendChild(item);
            });
        }

        /* Reproductor de Audio */
        function playSongFromList(playlist, index) {
            currentPlaylist = playlist;
            currentIndex = index;
            const song = currentPlaylist[currentIndex];

            currentTitle.textContent = song.name;
            artistNameText.textContent = song.artist;
            artistVerifiedIcon.style.display = song.isVerified ? 'inline-flex' : 'none';

            audioElement.src = song.url;
            audioElement.play();
            isPlaying = true;
            playBtn.textContent = '⏸';
        }

        playBtn.addEventListener('click', () => {
            if (!audioElement.src) return;
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            } else {
                audioElement.play();
                isPlaying = true;
                playBtn.textContent = '⏸';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playSongFromList(currentPlaylist, currentIndex);
        });

        nextBtn.addEventListener('click', () => {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            playSongFromList(currentPlaylist, currentIndex);
        });

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                const cur = audioElement.currentTime;
                const dur = audioElement.duration;
                progressBar.style.width = `${(cur / dur) * 100}%`;
                currentTimeEl.textContent = formatTime(cur);
                durationTimeEl.textContent = formatTime(dur);
            }
        });

        audioElement.addEventListener('ended', () => {
            nextBtn.click();
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audioElement.duration) {
                audioElement.currentTime = pos * audioElement.duration;
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audioElement.volume = parseFloat(e.target.value);
        });
    </script>
</body>
</html>
