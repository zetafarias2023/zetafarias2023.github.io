<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zona Optis + sensis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:white;
}

header{
  background:#111827;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

/* LOGIN */
#login{
  display:flex;
  justify-content:center;
  margin-top:80px;
}

.card{
  background:#1a1a2e;
  padding:20px;
  border-radius:12px;
  text-align:center;
  width:300px;
}

input{
  width:90%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

button{
  background:#00ff88;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin-top:10px;
}

/* APP */
#app{
  display:none;
}

/* TOPBAR */
.topbar{
  text-align:center;
  margin:10px;
  color:#aaa;
}

/* SHOP */
.container{
  display:flex;
  gap:10px;
  padding:10px;
}

.shop{
  width:70%;
}

.cardProd{
  background:#1a1a2e;
  padding:15px;
  margin-bottom:10px;
  border-radius:12px;
}

#cart{
  width:30%;
  background:#111827;
  padding:10px;
  border-radius:12px;
}

.item{
  font-size:14px;
}
</style>
</head>

<body>

<header>🔥 Zona Optis + sensis</header>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h2>🔐 Login</h2>
    <input id="username" placeholder="Ingresa tu usuario">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app">

<div class="topbar">
👤 Bienvenido: <span id="user"></span>
</div>

<div class="container">

<div class="shop">

<div class="cardProd">
<h3>🚀 Optimización PRO</h3>
<p>FPS Boost + Lag fix</p>
<b>$10 USD (ARG)</b>
<button onclick="add('Optimización PRO',10)">Agregar</button>
</div>

<div class="cardProd">
<h3>🎯 Sensibilidad PRO</h3>
<p>Aim control + precisión</p>
<b>$5 USD (ARG)</b>
<button onclick="add('Sensibilidad PRO',5)">Agregar</button>
</div>

</div>

<div id="cart">
<h3>🛒 Carrito</h3>
<div id="items"></div>
<hr>
Total: $<span id="total">0</span>
<br><br>
<button onclick="buy()">Comprar → Discord</button>
</div>

</div>

</div>

<script>
let cart=[];
let total=0;
let user="";

/* LOGIN */
function login(){
  const u = document.getElementById("username").value;
  if(!u) return;

  user = u;

  localStorage.setItem("user",user);

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";

  document.getElementById("user").innerText=user;
}

/* AUTO LOGIN */
window.onload = ()=>{
  const saved = localStorage.getItem("user");

  if(saved){
    user = saved;
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("user").innerText=user;
  }
};

/* CART */
function add(name,price){
  cart.push({name,price});
  total+=price;
  render();
}

function render(){
  let html="";
  cart.forEach(i=>{
    html+=`<div class="item">• ${i.name} - $${i.price}</div>`;
  });

  document.getElementById("items").innerHTML=html;
  document.getElementById("total").innerText=total;
}

/* BUY */
function buy(){
  window.open("https://discord.gg/GuyjHVrwnX","_blank");
}
</script>

</body>
</html>
